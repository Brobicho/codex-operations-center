[package]
name = "codex-operations-center"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A real-time, interactive operations center for Codex sessions"
repository = "https://github.com/Brobicho/codex-operations-center"
rust-version = "1.90"

[[bin]]
name = "codex-ops"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = { version = "1.8", features = ["pure"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
fs2 = "0.4"
glam = "0.30"
icy_sixel = "0.5"
png = "0.18"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-width = "0.2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
